services:
  mcpshield:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MCPSHIELD_API_TOKEN: ${MCPSHIELD_API_TOKEN:-}
      MCPSHIELD_LLM_MODEL: ${MCPSHIELD_LLM_MODEL:-}
      MCPSHIELD_LLM_API_KEY: ${MCPSHIELD_LLM_API_KEY:-}
      MCPSHIELD_LLM_BASE_URL: ${MCPSHIELD_LLM_BASE_URL:-https://api.openai.com/v1}
      MCPSHIELD_LLM_TIMEOUT: ${MCPSHIELD_LLM_TIMEOUT:-20}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
